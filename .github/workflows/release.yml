name: release

# Publishes a GitHub release for a plain vX.Y.Z tag (no suffix).
#
# A tag push runs this automatically. Manual dispatch covers a tag that was
# pushed before this workflow existed, or a release that has to be re-created.
# The tag is never created or moved here, and nothing is built for or run on
# target hardware.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check the tag name
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a plain vX.Y.Z tag."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      # The same host checks as CI, run against the tagged tree.
      - name: Install alsa-lib
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev
      - run: cmake -B build -DEA_REQUIRE_ALSA=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --no-tests=error

      # The tag must name the newest changelog version, src/version.c, the
      # component manifest, the README and the release notes in the tagged tree.
      - name: Check the tag against the tagged tree
        run: sh tools/check_release.sh . --tag "$TAG"

      # Notes come from the default branch, so they can be corrected without moving the tag.
      - name: Collect the release notes
        run: |
          git fetch --quiet origin "$DEFAULT_BRANCH"
          if ! git show "FETCH_HEAD:.github/release-notes/$TAG.md" > "$RUNNER_TEMP/notes.md"; then
            echo "::error::.github/release-notes/$TAG.md is missing on $DEFAULT_BRANCH."
            exit 1
          fi
          test -s "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Delete it first to re-create it."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
