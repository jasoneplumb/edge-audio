; edge-audio component-local PlatformIO configuration
;
; This repository is hardware-agnostic. Product-specific ESP32/ESP-IDF board
; configuration belongs to the consuming device repository.
;
; The native environment mirrors the existing hosted C11 build closely and
; provides a PlatformIO/IDE build context plus a lightweight link smoke test.
; The authoritative host/conformance suite remains CMake + CTest.

[platformio]
default_envs = native-smoke
src_dir = .

[env:native-smoke]
platform = native

build_flags =
    -std=c11
    -Wall
    -Wextra
    -Werror
    -O2
    -Iinclude
    -Itests
    -pthread
    -lm

build_src_filter =
    +<src/*.c>
    +<tests/test_smoke.c>
